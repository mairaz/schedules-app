<div class="card-container">
  <mat-card>
    <mat-card-content>
      <mat-card-header>
        <mat-card-title>
          Add Shift
        </mat-card-title>
      </mat-card-header>
      <div>
        <mat-form-field>
          <mat-select [(ngModel)]="selectedEmployee">
            @for(employee of employees(); track $index){
            <mat-option [value]="employee" [disabled]=" employeesAlreadyScheduled().has(employee.id)">{{employee.name}}</mat-option>
            }
          </mat-select>
        </mat-form-field>
        <button mat-raised-button color="primary" (click)="addUserShift()">Add</button>
      </div>
    </mat-card-content>
  </mat-card>

</div>
